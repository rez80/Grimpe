<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimpe</title>
<meta name="theme-color" content="#1F4E5A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimpe">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bandeau" style="display:none">Nouvelle version disponible — <button data-act="majApp">mettre à jour</button></div>
<header id="entete">
  <button id="prec" data-act="prec" aria-label="Précédent">‹</button>
  <div id="titre-bloc"><div id="titre">Grimpe</div><div id="infos"></div></div>
  <button id="btn-aide" data-act="aideContexte" aria-label="Aide sur cet écran"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.6 2.4c-.8.4-1.1.9-1.1 1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></svg></button>
  <button id="btn-menu" data-act="menuEcran" aria-label="Menu de l'écran">⋯</button>
  <button id="suiv" data-act="suiv" aria-label="Suivant">›</button>
</header>
<main id="ecran"><p class="petit centre" style="padding:40px 0">Chargement…</p></main>
<nav id="onglets">
  <button data-act="onglet" data-onglet="seance"><span class="ico"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 10.5 7l3.5 6 2-3L21 20z" fill="currentColor"/><circle cx="17" cy="5" r="2" fill="currentColor"/></svg></span>Séance</button>
  <button data-act="onglet" data-onglet="programme"><span class="ico"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 9.5h17M8 3v3M16 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 13h3v3H7z" fill="currentColor"/></svg></span>Programme</button>
  <button data-act="onglet" data-onglet="progres"><span class="ico"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 19.5h17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 16l4.5-5 3.5 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h4v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Progrès</button>
  <button data-act="onglet" data-onglet="plus"><span class="ico"><svg class="ico-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="18.5" cy="12" r="2" fill="currentColor"/></svg></span>Plus<span id="pastille-plus" class="pastille-nav" style="display:none"></span></button>
</nav>
<div id="minuteur"></div>
<div id="toast" style="display:none"></div>
<div id="fond-modal" style="display:none"><div id="modal" role="dialog"></div></div>
<noscript>Cette app a besoin de JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
